name: PORTEX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract PORTEX
        run: |
          mkdir -p PORTEX_Prototype
          unzip -q PORTEX_Prototype_0.1.zip -d PORTEX_Prototype

      - name: Locate project root
        run: |
          SETTINGS=$(find PORTEX_Prototype -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle não encontrado. Estrutura do zip:"
            find PORTEX_Prototype -maxdepth 3 | head -50
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Projeto em: $ROOT"
          ls -la "$ROOT"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PORTEX-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_ROOT }}/**/build/reports/
          if-no-files-found: ignore