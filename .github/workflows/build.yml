      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set +e
          if [ -f gradlew ]; then chmod +x gradlew; CMD=./gradlew; else CMD=gradle; fi
          $CMD assembleDebug --console=plain --no-daemon 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### Erro do build" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/What went wrong/,/\* Try/p' build.log | head -40 >> "$GITHUB_STEP_SUMMARY"
            grep -E '^e: ' build.log | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "=== RESUMO DO ERRO ==="
            sed -n '/What went wrong/,/\* Try/p' build.log | head -40
          fi
          exit $STATUS