
name: Build PORTEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PORTEX_Prototype_0.1.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir PORTEX_Prototype
          unzip -q PORTEX_Prototype_0.1.zip -d PORTEX_Prototype

      - name: Build APK
        working-directory: PORTEX_Prototype
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PORTEX-APK
          path: PORTEX_Prototype/app/build/outputs/apk/debug/app-debug.apk
